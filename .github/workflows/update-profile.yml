name: Update profile

on:
  schedule:
    - cron: "17 4 * * *"      # daily
  workflow_dispatch:           # manual start: Actions tab -> Update profile -> Run workflow
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/frames.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild card and project table
        run: python3 scripts/update_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md assets/neofetch.svg
            git commit -m "chore: update profile data"
            git push
          fi
